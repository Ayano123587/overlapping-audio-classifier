name: audio-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: overlap-audio synthetic
      - run: overlap-audio train data/raw/synthetic/manifest.json --epochs 1 --count 64 --report smoke.json
